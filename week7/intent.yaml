# intent.yaml: what the lab API should hold, for the Week 7 assignment. Your sync.py makes it so.
#
# Anything on the API that ISN'T here is removed by sync.py (except VLAN 1): this file is the
# whole truth, like Week 2's network.yaml.

student_id_last4: "4963"

vlans:
  - {id: 10, name: users}
  - {id: 20, name: servers}
  - {id: 30, name: guests}
  - {id: 40, name: voice}
  - {id: 50, name: mgmt}
  - {id: 60, name: iot}

acl:
  - {action: deny, src: 10.63.30.0/24, dst: 10.63.20.0/24, protocol: tcp, port: 22, description: guests-no-ssh}
  - {action: permit, src: 10.63.10.0/24, dst: 10.63.20.0/24, protocol: tcp, port: 443, description: users-to-servers-https}
  - {action: deny, src: 10.63.30.0/24, dst: 10.63.10.0/24, protocol: any, description: guests-no-users}
  - {action: permit, src: 10.63.50.0/24, dst: 10.63.20.0/24, protocol: tcp, port: 22, description: mgmt-ssh-to-servers}
  - {action: deny, src: 10.63.60.0/24, dst: 10.63.20.0/24, protocol: any, description: iot-no-servers}