  learning:
    question: "How did your switches learn which port leads to each host? Use your MAC table evidence."
    answer: "By using Arp , first h1 with macAddress(00:00:00:00:00:01) ping h2 with macAddress(00:00:00:00:00:02) but h1 does not have the mac address of h2 so it send a arp reqeust target h2 ip . Then switch will learn the macAddress of h1 and the port for ex port 1 with mac 00:00:00:00:00:01. Then switch will flood the arp request to all the other port except incoming port in the same vlan and when h2 reply , the switch will receive the arp reply and record down the port and macAddress for ex port 2 mac macAddress 00:00:00:00:00:02"
